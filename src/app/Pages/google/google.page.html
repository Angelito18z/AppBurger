<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button> <!-- Botón para abrir el menú -->
    </ion-buttons>
    <ion-title>Google</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="!user; else userInfo">
    <div id="google-signin-button"></div>
  </div>

  <ng-template #userInfo>
    <div>
      <h2>Bienvenido {{ user.name }}!</h2>
      <img [src]="user.imageUrl" alt="User profile picture">
      <p>Email: {{ user.email }}</p>
      <ion-button (click)="signOut()">Sign Out</ion-button>
    </div>
  </ng-template>
</ion-content>
